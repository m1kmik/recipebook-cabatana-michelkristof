{% extends 'base.html' %}
{% block title %}Recipe List{% endblock %}
{% block page_heading %}All Recipes{% endblock %}
{% block content %}
    <ul>
        {% for recipe in recipes %}
            <li><a href="{% url 'recipes:recipe-detail' recipe.pk %}">{{ recipe.name }}</a></li>
        {% empty %}
            <li>No recipes here yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
