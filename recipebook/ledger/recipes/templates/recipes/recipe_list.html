{% extends 'base.html' %}
{% block title %}Recipe Book{% endblock %}
{% block content %}
    <h1>Recipe Book</h1>
    <ul>
        {% for recipe in recipe_list %}
            <li><a href="{% url 'recipes:recipe-detail' recipe.pk %}">{{ recipe.name }}</a></li>
        {% empty %}
            <li>No recipes here yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
